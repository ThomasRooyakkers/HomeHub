services:
  homehub:
    build: .
    container_name: homehub
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-5080}:80"
    volumes:
      - homehub_data:/data
    networks:
      - homehub
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    profiles:
      - tunnel
    image: cloudflare/cloudflared:2026.5.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - homehub
    depends_on:
      - homehub

volumes:
  homehub_data:

networks:
  homehub:
