services:
  homehub:
    build: .
    container_name: homehub
    restart: unless-stopped
    ports:
      - "5080:80"
    env_file:
      - .env
    volumes:
      - homehub_data:/data
    networks:
      - homehub
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  homehub_data:

networks:
  homehub:
