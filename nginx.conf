events {}
http {
  include mime.types;
  types {
    application/javascript  mjs;
  }
  server {
    listen 80;
    root /app/public;
    index index.html;
    location /api/ { proxy_pass http://localhost:3001; }
    location /uploads/ { proxy_pass http://localhost:3001; }
    location / { try_files $uri /index.html; }
  }
}
