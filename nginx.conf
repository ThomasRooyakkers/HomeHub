events {}
http {
  include mime.types;
  types {
    application/javascript  mjs;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  server {
    listen 80;
    root /app/public;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.open-meteo.com; font-src 'self'" always;

    location /api/ { proxy_pass http://localhost:3001; }
    location /uploads/ { proxy_pass http://localhost:3001; }
    location / { try_files $uri /index.html; }
  }
}
